# CI — the solo developer's second engineer (opsflow-contracts).
# Runs on every PR + push to main: secret scan, dep audit, typecheck, lint,
# format check, tests + coverage, build. No internal deps, no secrets needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - name: Secret scan (gitleaks)
        # Dependabot PRs run with a restricted token that can't read the PR commits
        # API (403); they only bump deps, so skip the scan there.
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci --coverage
      - run: npm run build
